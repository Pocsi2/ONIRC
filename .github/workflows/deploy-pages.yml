name: Deploy Onirc to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run test:rules

      - name: Validate trusted archive Worker
        run: npm run worker:check

      - name: Install browser for end-to-end checks
        run: npx playwright install --with-deps chromium

      - name: Validate local static experience
        run: npm run test:e2e

  build:
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      artifact-ready: ${{ steps.static-output.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Pages site
        env:
          ONIRC_BASE_PATH: /ONIRC
          # Empty or any value other than "available" safely keeps the archive hidden.
          NEXT_PUBLIC_PUBLIC_ARCHIVE_STATE: ${{ vars.ONIRC_PUBLIC_ARCHIVE_STATE }}
          NEXT_PUBLIC_PUBLIC_ARCHIVE_API_URL: ${{ vars.ONIRC_PUBLIC_ARCHIVE_API_URL }}
        run: npm run build

      - name: Verify static output
        id: static-output
        run: |
          test -d out
          test -f out/index.html
          test -f out/calendar/index.html
          test -f out/explorar/index.html
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.artifact-ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed routes
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page-url }}
        run: |
          for path in "" "calendar/" "explorar/"; do
            curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors "${PAGE_URL}${path}"
          done
